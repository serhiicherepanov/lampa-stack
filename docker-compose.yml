---
services:
  traefik:
    build: traefik
    profiles: [standalone]
    container_name: traefik
    restart: always
    command:
      - "--ping=true"
      - "--log.level=INFO"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/traefik.d"
      - "--entrypoints.unsecure.address=:80"
      - "--entrypoints.unsecure.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_IPS:-173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32}"
      - "--entrypoints.default.address=:443"
      - "--entrypoints.default.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_IPS:-173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32}"
      - "--entrypoints.default.http.tls=true"
      - "--entrypoints.default.http.tls.certresolver=default"
      - "--certificatesresolvers.default.acme.email=${LETSENCRYPT_EMAIL:-}"
      - "--certificatesresolvers.default.acme.httpchallenge=true"
      - "--certificatesresolvers.default.acme.httpchallenge.entrypoint=unsecure"
      - "--certificatesresolvers.default.acme.storage=/letsencrypt/acme.json"
    ports:
      - "${TRAEFIK_BIND_ADDRESS:-0.0.0.0}:${TRAEFIK_BIND_PORT:-80}:80"
      - "${TRAEFIK_BIND_ADDRESS_HTTPS:-0.0.0.0}:${TRAEFIK_BIND_PORT_HTTPS:-443}:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./data/traefik/letsencrypt:/letsencrypt"
      - "./traefik/traefik.d:/traefik.d:ro"
    networks:
      - "default"
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.traefikapi.rule=Host(`${LAMPA_DOMAIN}`) && PathPrefix(`/api/`) && HeadersRegexp(`Referer`, `^https?:\/\/.+\/traefik\/dashboard\/`)'
      - 'traefik.http.routers.traefikapi.entrypoints=unsecure,default'
      - 'traefik.http.routers.traefikapi.service=api@internal'
      - 'traefik.http.routers.traefikapi.middlewares=https-redirect@file,traefik-auth'
      - 'traefik.http.routers.traefikdashboard.rule=Host(`${LAMPA_DOMAIN}`) && PathPrefix(`/traefik/dashboard/`)'
      - 'traefik.http.routers.traefikdashboard.priority=500'
      - 'traefik.http.routers.traefikdashboard.entrypoints=unsecure,default'
      - 'traefik.http.routers.traefikdashboard.service=api@internal'
      - 'traefik.http.routers.traefikdashboard.middlewares=https-redirect@file,traefik-auth,traefik-stripprefix'
      - 'traefik.http.middlewares.traefik-stripprefix.stripprefix.prefixes=/traefik'
      - 'traefik.http.middlewares.traefik-auth.basicauth.users=admin:{SHA}0tTNr469Z7oY3fDRwNoUXE2vTBw='
    depends_on:
      lampa:
        condition: service_healthy
      torrserver:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 5s
      interval: 5s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  lampa:
    container_name: lampa
    build:
      context: lampa
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org/}"
        TORRSERVER_DOMAIN: "${TORRSERVER_DOMAIN}"
        TORRSERVER_DOMAIN_TWO: "${TORRSERVER_DOMAIN_TWO:-}"
        TORRSERVER_LOGIN: "${TORRSERVER_LOGIN:-}"
        TORRSERVER_PASSWORD: "${TORRSERVER_PASSWORD:-}"
        PARSER_TORRENT_TYPE: "${PARSER_TORRENT_TYPE:-torrserver}"
        PARSER_URL: "${PARSER_URL:-}"
        PARSER_APIKEY: "${PARSER_APIKEY:-}"
        JACKETT_DOMAIN: "${JACKETT_DOMAIN:-}"
        JACKETT_APIKEY: "${JACKETT_APIKEY:-}"
        PROWLARR_DOMAIN: "${PROWLARR_DOMAIN:-}"
        PROWLARR_APIKEY: "${PROWLARR_APIKEY:-}"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    healthcheck:
      test: /bin/bash -c "</dev/tcp/localhost/80"
      start_period: 60s
      interval: 5s
    networks:
      - "default"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lampa.entrypoints=unsecure,default"
      - "traefik.http.routers.lampa.rule=Host(`${LAMPA_DOMAIN}`)"
      - "traefik.http.routers.lampa.middlewares=https-redirect@file,noindex@file,lampa-cors@docker,gzip@file"
      - "traefik.http.services.lampa.loadbalancer.server.port=80"
      - "traefik.http.middlewares.lampa-cors.headers.accessControlAllowOriginList=*"
      - "traefik.http.middlewares.lampa-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.lampa-cors.headers.accessControlAllowHeaders=*"
      - "traefik.http.middlewares.lampa-cors.headers.accessControlExposeHeaders=*"
      - "traefik.http.middlewares.lampa-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.lampa-cors.headers.addVaryHeader=true"

  torrserver:
    container_name: torrserver
    build: torrserver
    environment:
      - TS_PORT=80
      - TS_DONTKILL=1
      - TS_HTTPAUTH=0
      - TS_CONF_PATH=/config
      - TS_TORR_DIR=/torrents
    volumes:
      - './data/torrserver/torrents:/torrents'
      - './data/torrserver/config:/config'
    #ports:
    #  - '80:80'
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    healthcheck:
      test: /bin/bash -c "</dev/tcp/localhost/80"
      start_period: 60s
      interval: 5s
    networks:
      - "default"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.torrserver.entrypoints=unsecure,default"
      - "traefik.http.routers.torrserver.rule=Host(`${TORRSERVER_DOMAIN}`)"
      - "traefik.http.services.torrserver.loadbalancer.server.port=80"
      - "traefik.http.routers.torrserver.middlewares=https-redirect@file,noindex@file,torrserver-cors"
      - "traefik.http.middlewares.torrserver-cors.headers.accessControlAllowOriginListRegex=${LAMPA_DOMAIN}|.*\\.${LAMPA_DOMAIN}|localhost"
      - "traefik.http.middlewares.torrserver-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.torrserver-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,Accept"
      - "traefik.http.middlewares.torrserver-cors.headers.accessControlExposeHeaders=*"
      - "traefik.http.middlewares.torrserver-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.torrserver-cors.headers.addVaryHeader=true"

  jackett:
    container_name: jackett
    profiles: [jackett]
    image: lscr.io/linuxserver/jackett:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tbilisi
      - AUTO_UPDATE=true
    volumes:
      - './data/jackett/config:/config'
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    healthcheck:
      test: /bin/bash -c "</dev/tcp/localhost/9117"
      start_period: 60s
      interval: 5s
    networks:
      - "default"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jackett.entrypoints=unsecure,default"
      - "traefik.http.routers.jackett.rule=Host(`${JACKETT_DOMAIN:-}`)"
      - "traefik.http.routers.jackett.middlewares=https-redirect@file,noindex@file,jackett-cors@docker,gzip@file"
      - "traefik.http.services.jackett.loadbalancer.server.port=9117"
      - "traefik.http.middlewares.jackett-cors.headers.accessControlAllowOriginListRegex=${LAMPA_DOMAIN}|.*\\.${LAMPA_DOMAIN}|localhost"
      - "traefik.http.middlewares.jackett-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.jackett-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,Accept"
      - "traefik.http.middlewares.jackett-cors.headers.accessControlExposeHeaders=*"
      - "traefik.http.middlewares.jackett-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.jackett-cors.headers.addVaryHeader=true"

  prowlarr:
    container_name: prowlarr
    profiles: [prowlarr]
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Tbilisi
      # Empty value keeps the key Prowlarr generated in config.xml
      - PROWLARR__AUTH__APIKEY=${PROWLARR_APIKEY:-}
    volumes:
      - './data/prowlarr/config:/config'
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
    healthcheck:
      test: /bin/bash -c "</dev/tcp/localhost/9696"
      start_period: 60s
      interval: 5s
    networks:
      - "default"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.entrypoints=unsecure,default"
      - "traefik.http.routers.prowlarr.rule=Host(`${PROWLARR_DOMAIN:-}`)"
      - "traefik.http.routers.prowlarr.middlewares=https-redirect@file,noindex@file,prowlarr-cors@docker,gzip@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.middlewares.prowlarr-cors.headers.accessControlAllowOriginListRegex=${LAMPA_DOMAIN}|.*\\.${LAMPA_DOMAIN}|localhost"
      - "traefik.http.middlewares.prowlarr-cors.headers.accessControlAllowMethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.prowlarr-cors.headers.accessControlAllowHeaders=Content-Type,Authorization,X-Requested-With,Accept"
      - "traefik.http.middlewares.prowlarr-cors.headers.accessControlExposeHeaders=*"
      - "traefik.http.middlewares.prowlarr-cors.headers.accessControlAllowCredentials=true"
      - "traefik.http.middlewares.prowlarr-cors.headers.addVaryHeader=true"

networks:
  default:
    name: "${NETWORK_NAME:-lampa}"
    driver_opts:
      # Below Docker's 1500 so traffic survives VPN tunnels (NordVPN/WireGuard) on the host
      com.docker.network.driver.mtu: "${NETWORK_MTU:-1380}"
